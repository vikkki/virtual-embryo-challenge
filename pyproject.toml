[project]
name = "vec"
version = "0.1.0"
description = "Virtual Embryo Challenge (NeurIPS 2026) workspace"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "scanpy>=1.10",
  "numpy",
  "scipy",
  "pandas",
  "veckit==0.1.2",
  "python-dotenv",
  "requests",
]

[project.optional-dependencies]
dev = ["pytest", "jupyterlab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
